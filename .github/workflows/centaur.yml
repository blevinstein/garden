name: Centaur

on:
  repository_dispatch:
    types: [centaur-message]
  push:
    branches: [main]
    paths: [.centaur.yml]
  workflow_dispatch:
    inputs:
      action:
        description: Register the bot, or start a thread from the weekly-tasks prompt.
        type: choice
        options: [register, weekly-tasks]
        default: weekly-tasks
  schedule:
    # Saturday 15:00 UTC (09:00 MDT / 08:00 MST in Denver). GitHub cron is always UTC.
    - cron: "0 15 * * 6"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  register:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'register')
    uses: blevinstein/centaur/.github/workflows/register.yml@main
    with:
      centaur_repository: blevinstein/centaur
      centaur_ref: main
  message:
    if: github.event_name == 'repository_dispatch'
    uses: blevinstein/centaur/.github/workflows/agent-turn.yml@main
    with:
      centaur_repository: blevinstein/centaur
      centaur_ref: main
    secrets: inherit
  scheduled:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'weekly-tasks')
    uses: blevinstein/centaur/.github/workflows/agent-turn.yml@main
    with:
      prompt_name: weekly-tasks
      centaur_repository: blevinstein/centaur
      centaur_ref: main
    secrets: inherit
