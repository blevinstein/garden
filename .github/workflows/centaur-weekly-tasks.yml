name: Centaur weekly tasks

on:
  schedule:
    # Saturday 15:00 UTC (09:00 MDT / 08:00 MST in Denver). GitHub cron is always UTC.
    - cron: "0 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  weekly-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: blevinstein/centaur/.github/actions/setup-runtime@experiment/composite-actions
      - uses: blevinstein/centaur/.github/actions/turn@experiment/composite-actions
        with:
          prompt_name: weekly-tasks
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure()
        uses: blevinstein/centaur/.github/actions/notify-failure@experiment/composite-actions
