bot: garden
platforms:
  telegram:
    respond_to: all
  slack:
    respond_to: all
chat_tools:
  scope: chat
provider: anthropic
model: sonnet
# Cost caps: respond_to: all runs a turn for every message, and a Markdown-only repo needs
# little reasoning or tool use. No shell: the agent edits Markdown and the workflow opens the PR.
effort: low
max_turns: 15
max_budget_usd: 0.5
allowed_tools: "Read,Glob,Grep,Edit,Write"
prompts:
  weekly-tasks:
    destination: { telegram: garden-jb }
